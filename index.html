<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mülakat Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-width column of index cards; fixed tab bar at the bottom.
   Same index-card world as the plan page: blue rules, one red margin line. */
:root {
  --paper: #f5f6fa;
  --card: #ffffff;
  --ink: #1b2340;
  --muted: #5d6685;
  --rule: #d9def0;
  --accent: #2f5bd3;
  --accent-soft: #e6ecfc;
  --on-accent: #ffffff;
  --margin: #d2453a;
  --ok: #1f8a5b;
  --ok-soft: #e2f4ea;
  --warn: #b5620c;
  --warn-soft: #fbefdf;
  --bad: #c23b31;
  --bad-soft: #fbe7e5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --nav-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141d; --card: #191d29; --ink: #e5e8f2; --muted: #9aa2bd; --rule: #2b3147;
    --accent: #84a2ff; --accent-soft: #222c4a; --on-accent: #0f1320; --margin: #e36a5f;
    --ok: #5cc994; --ok-soft: #173326; --warn: #e9a352; --warn-soft: #3a2a14; --bad: #ef7b70; --bad-soft: #3a1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141d; --card: #191d29; --ink: #e5e8f2; --muted: #9aa2bd; --rule: #2b3147;
  --accent: #84a2ff; --accent-soft: #222c4a; --on-accent: #0f1320; --margin: #e36a5f;
  --ok: #5cc994; --ok-soft: #173326; --warn: #e9a352; --warn-soft: #3a2a14; --bad: #ef7b70; --bad-soft: #3a1d1b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; line-height: 1.15; }
h2 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 14px; max-width: 60ch; }

.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 18px; }
.daybadge { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

/* Tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--card); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs button { appearance: none; background: none; border: 0; color: var(--muted); font: 500 12.5px var(--body); height: var(--nav-h); cursor: pointer; position: relative; }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 600; }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }

/* Buttons */
.btn {
  appearance: none; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  font: 600 15px var(--body); padding: 11px 16px; border-radius: 8px; cursor: pointer; min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .link:focus-visible, .chipbtn:focus-visible, .arow:focus-visible, .anshead:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; }
.link { appearance: none; border: 0; background: none; color: var(--accent); font: 500 14px var(--body); cursor: pointer; padding: 8px 0; }
.chipbtn { appearance: none; border: 1px solid var(--rule); background: transparent; color: var(--muted); font: 500 12px var(--body); padding: 3px 9px; border-radius: 999px; cursor: pointer; }

/* Panels (Today) */
.stack { display: grid; gap: 12px; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ph .mono { font-size: 13px; color: var(--muted); }
.panel .q { font-weight: 500; }
.panel .hint, .hint { color: var(--muted); font-size: 13.5px; }
.hero { display: grid; gap: 6px; margin-bottom: 16px; }
.foot { margin-top: 18px; color: var(--muted); font-size: 13px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }

/* Index card */
.icard {
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
  padding: 18px 18px 16px 34px; position: relative; min-height: 230px;
  display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px;
}
.icard::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 1px; background: var(--margin); opacity: .5; }
.ctx { font-size: 12px; color: var(--muted); letter-spacing: .02em; display: flex; gap: 6px; flex-wrap: wrap; }
.ctx b { color: var(--ink); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.en { font-size: clamp(20px, 5.4vw, 24px); font-weight: 500; line-height: 1.38; overflow-wrap: anywhere; }
.en.small { font-size: 16px; color: var(--muted); font-weight: 400; }
.tr { font-size: 17px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
.tr.big { font-size: clamp(19px, 5vw, 22px); color: var(--ink); }
.masked { filter: blur(7px); user-select: none; }
.cardfoot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tier { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tier.ezber { background: var(--bad-soft); color: var(--bad); }
.timer { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timer.slow { color: var(--warn); }
.timer.big { font-size: 44px; color: var(--ink); line-height: 1; }
.sesshead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.sesshead .mono { font-size: 13px; color: var(--muted); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.steps span { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
.steps span.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.steps span.did { color: var(--ok); border-color: transparent; background: var(--ok-soft); }
.say { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--accent); }
.say::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.count { font-family: var(--mono); font-size: 40px; line-height: 1; color: var(--accent); }

.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grade { flex-direction: column; gap: 2px; padding: 8px 4px; min-height: 58px; font-size: 14px; }
.grade small { font: 400 11px var(--mono); color: var(--muted); }
.g0 { color: var(--bad); border-color: var(--bad); }
.g2 { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.g2 small { color: var(--on-accent); opacity: .8; }
.g3 { color: var(--ok); border-color: var(--ok); }
.kbd { color: var(--muted); font-size: 12px; margin-top: 12px; text-align: center; }
@media (hover: none) { .kbd { display: none; } }

/* Segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 3px; margin: 12px 0 14px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 14px var(--body); padding: 9px 6px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Answer list (Prova) */
.alist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.arow { appearance: none; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--ink); font: inherit; display: grid; gap: 4px; }
.arow .q { font-weight: 500; }
.arow .meta { font-size: 12.5px; color: var(--muted); }
.minibar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--ok); }
.result { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.result div { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
.result b { display: block; font: 600 22px var(--mono); }
.result span { font-size: 12px; color: var(--muted); }
.reslist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.reslist li { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.reslist li .mono { color: var(--muted); font-size: 12px; white-space: nowrap; }
.anslines { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.anslines li { font-size: 16px; line-height: 1.45; padding-left: 12px; border-left: 3px solid var(--rule); }
.anslines li.ezber { border-left-color: var(--bad); font-weight: 500; }
.bigq { font-family: var(--display); font-size: clamp(22px, 6vw, 28px); font-weight: 600; line-height: 1.2; }

/* Lines (Cümleler) */
.ans { border-bottom: 1px solid var(--rule); }
.anshead { appearance: none; width: 100%; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; padding: 14px 0; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; cursor: pointer; }
.anshead .num { color: var(--muted); font-size: 12px; }
.anshead .q { font-weight: 600; }
.anshead .cnt { color: var(--muted); font-size: 12px; }
.qtr { color: var(--muted); font-size: 13.5px; margin: -6px 0 10px 44px; }
ol.lines { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
li.line { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 12px 10px 14px; display: grid; gap: 6px; }
li.line.ezber { border-left: 3px solid var(--bad); }
li.line .en { font-size: 16px; font-weight: 500; }
li.line .tr { font-size: 14.5px; }
.lact { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lact .sp { flex: 1; }
.flag { font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 9px; }
.orig { font-size: 13px; color: var(--muted); background: var(--paper); border-radius: 6px; padding: 7px 9px; }
.orig span { font-weight: 600; color: var(--ink); }
.form { display: grid; gap: 8px; }
.form label { font-size: 12px; color: var(--muted); font-weight: 500; }
.form textarea, .form select { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 10px; resize: vertical; }
.form textarea:focus, .form select:focus, .set select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.confirm { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px; display: grid; gap: 8px; font-size: 14px; }
.addbox { background: transparent; border: 1px dashed var(--rule); border-radius: 8px; padding: 12px; margin-bottom: 16px; }

/* Settings */
.set { display: grid; gap: 8px; }
.set select { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
.set input[type=range] { width: 100%; accent-color: var(--accent); }
.rangehead { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14.5px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.speaking { background: var(--accent-soft); box-shadow: 0 0 0 6px var(--accent-soft); border-radius: 4px; }
.siri-hint { font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; }
details.howto { font-size: 14px; }
details.howto summary { cursor: pointer; color: var(--accent); font-weight: 500; padding: 4px 0; }
details.howto ol { margin: 6px 0 10px; padding-left: 20px; display: grid; gap: 3px; }
details.howto .k { font-weight: 600; margin-top: 8px; }
details.howto p { color: var(--muted); }
.vh + label.btn { cursor: pointer; }
.vh:focus-visible + label.btn { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh:disabled + label.btn { opacity: .45; cursor: default; }

/* Track */
.player { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 16px 34px; position: relative; min-height: 200px; display: flex; flex-direction: column; gap: 12px; margin: 14px 0; }
.player::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 1px; background: var(--margin); opacity: .5; }
.opts { display: grid; gap: 10px; }

.state { padding: 28px 20px; border: 1px dashed var(--rule); border-radius: 10px; color: var(--muted); background: var(--card); }
.state b { color: var(--ink); display: block; margin-bottom: 4px; font-weight: 600; }
.skel { height: 14px; border-radius: 3px; background: var(--rule); margin: 16px 0; opacity: .6; }
.skel.s2 { width: 70%; } .skel.s3 { width: 50%; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) { .say::before { animation: none; } }

.gate { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.gate-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 24px 22px 22px 36px; position: relative; display: grid; gap: 12px; }
.gate-card::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 1px; background: var(--margin); opacity: .5; }
.gate-card label { font-size: 12px; color: var(--muted); font-weight: 500; }
.gate-card input { font: 17px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 11px 12px; width: 100%; }
.gate-card input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.gate-err { color: var(--bad); font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><span class="brand">Mülakat Trainer</span><span class="daybadge" id="daybadge"></span></div>
  <main id="view"><div class="state"><b>Yükleniyor</b><div class="skel"></div><div class="skel s2"></div><div class="skel s3"></div></div></main>
</div>
<nav class="tabs" aria-label="Bölümler"><div class="in">
  <button data-act="tab" data-tab="today" aria-current="page">Bugün</button>
  <button data-act="tab" data-tab="reh">Prova</button>
  <button data-act="tab" data-tab="track">Dinle</button>
  <button data-act="tab" data-tab="lines">Cümleler</button>
  <button data-act="tab" data-tab="settings">Ayarlar</button>
</div></nav>
<div class="toast" id="toast" hidden></div>
<div id="live" class="vh" aria-live="polite" lang="en-US"></div>

<div id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-card" autocomplete="off">
    <h1>Mülakat Trainer</h1>
    <p class="sub" id="gate-sub">Bu cihazda ilk açılış. Parolayı gir; bir daha sorulmaz.</p>
    <label for="gate-pass">Parola</label>
    <input id="gate-pass" name="password" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button class="btn primary wide" type="submit">Aç</button>
    <button class="link" type="button" id="gate-skip" hidden>Şimdi değil</button>
    <p id="gate-err" class="gate-err" hidden>Parola yanlış. Tekrar dene.</p>

}

  top(); introEnter();
}
function curIntro() { var s = S.sess; return s.batches[s.b][s.i]; }

function introEnter() {

  var tok = audioTok, it = curIntro();

}

  var k = 0;

    k++;
    if (k > 3) { return imagery(); }
    s.shadow = k; s.shPhase = 'listen'; render();
    wait(60, tok).then(function () { return speak(it.l.en, 'en', tok); }).then(function (ms) {
      if (S.sess !== s || tok !== audioTok) return;

  }
  function imagery() {

  function alive() { return tok === audioTok && S.track && S.track.tok === tok; }

        .then(function () { if (!alive()) return; T.phase = 'en'; updPlayer(); return speak(it.l.en, 'en', tok); })

  cancelEdit: function () { S.edit = null; S.confirmDel = null; render(); },
  saveEdit: saveEdit,
  askDel: function () { if (S.edit) { S.confirmDel = S.edit.lid; render(); } },
  cancelDel: function () { S.confirmDel = null; render(); },
  confirmDel: deleteLine,
  translate: function (el) { translate(el); },
  addLine: function (el) { addLine(el); },
  testEn: function () { var l = S.answers[0] && S.answers[0].lines[0]; play(l ? l.en : "I'm a QA automation engineer.", 'en'); },
  testTr: function () { var l = S.answers[0] && S.answers[0].lines[0]; play(l ? l.tr : 'Bir QA otomasyon mühendisiyim.', 'tr'); },
  copyMissing: copyMissing,
  ttsEnable: function () { var T = window.__localTTS; if (!T) return; T.enable().then(function () { T.queue(missingEn()); }, function () {}); render(); },
  ttsFill: function () { var T = window.__localTTS; if (T) { T.queue(missingEn()); render(); } },
  voiceMode: function (el) { stopAudio(); U.settings.voiceMode = el.dataset.m; save('settings'); render(); },
  exportNotes: function (el) { shareOrCopy(notesText(el.dataset.tr === '1'), 'Mülakat cevapları', 'notesbox', 'Notlar için metin'); },
  exportProg: function () { shareOrCopy(exportCode(), 'Trainer ilerleme kodu', 'progbox', 'İlerleme kodu'); },
  importProg: function (el) {
    var code = val('imp-code');
    if (!code.trim()) { toast('Önce kodu yapıştır.'); return; }
    if (el.dataset.armed !== '1') { el.dataset.armed = '1'; el.textContent = 'Emin misin? Tekrar dokun'; return; }
    try { importCode(code); toast('İlerleme içe aktarıldı.'); render(); }
    catch (e) { el.dataset.armed = ''; el.textContent = 'İçe aktar (bu cihazdakinin yerine geçer)'; toast('Kod okunamadı; MT1: ile başlayan kodun tamamını yapıştır.'); }
  }
};
var unlocked = false;
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (!unlocked && synth) { unlocked = true; try { var u0 = new SpeechSynthesisUtterance(' '); u0.volume = 0; synth.speak(u0); } catch (err) {} }
  if (!S.sess || !audUnlocked) unlockAudio();
  var f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'v-en') { U.settings.enVoice = t.value; pickVoices(); save('settings'); }
  else if (t.id === 'v-tr') { U.settings.trVoice = t.value; pickVoices(); save('settings'); }
  else if (t.id === 'set-trauto') { U.settings.trAuto = t.checked; save('settings'); }
  else if (t.id === 'set-listen') { U.settings.listen = t.checked; save('settings'); }
  else if (t.id === 'set-files') { U.settings.useFiles = t.checked; save('settings'); }
  else if (t.id === 'aud-files') { uploadFiles(t.files); }
  else if (t.id === 'tr-scope') { if (S.track) trackStop(true); S.trackCfg.scope = t.value; S.trackCfg.once = false; render(); }
  else if (t.id === 'tr-shuffle') { S.trackCfg.shuffle = t.checked; }
  else if (t.id === 'tr-text') { S.trackCfg.text = t.checked; updPlayer(); }
});
document.addEventListener('input', function (e) {
  var t = e.target, o;
  if (t.id === 'rate-en') { U.settings.rateEn = +t.value; o = document.getElementById('rate-en-o'); if (o) o.textContent = (+t.value).toFixed(2); save('settings'); }
  else if (t.id === 'rate-tr') { U.settings.rateTr = +t.value; o = document.getElementById('rate-tr-o'); if (o) o.textContent = (+t.value).toFixed(2); save('settings'); }
});
document.addEventListener('focusout', function () { setTimeout(function () { if (S.pending) softRender(); }, 50); });
document.addEventListener('keydown', function (e) {
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  var s = S.sess; if (!s) return;
  var go = e.code === 'Space' || e.key === 'Enter';
  if (s.type === 'review') {
    if (!s.shown && go) { e.preventDefault(); reveal(); }
    else if (s.shown && /^[1-4]$/.test(e.key)) grade(+e.key - 1);
  } else if (s.type === 'test' && s.phase !== 'result') {
    if (!s.shown && go) { e.preventDefault(); testReveal(); }
    else if (s.shown && (e.key === '1' || e.key === '2')) testMark(e.key === '2');
  } else if (s.type === 'intro' && s.phase === 'quiz') {
    if (!s.quiz.shown && go) { e.preventDefault(); quizReveal(); }
    else if (s.quiz.shown && (e.key === '1' || e.key === '2')) quizMark(e.key === '2');
  } else if (s.type === 'intro' && s.phase === 'learn' && s.step === 4 && go) { e.preventDefault(); introNext(); }
});
setInterval(function () {
  var s = S.sess, el = document.getElementById('timer'); if (!s || !el) return;
  if (s.type === 'reh') { if (s.phase === 'talk') el.textContent = mmss(Date.now() - s.t0); return; }
  if ((s.type === 'review' || s.type === 'test') && !s.shown) {
    if (!s.t0) { el.textContent = ''; return; }
    var ms = Date.now() - s.t0; el.textContent = fmtSec(ms); el.classList.toggle('slow', ms > 3000);
  }
}, 100);

/* ---------- boot ---------- */
function init() {
  if (LOCAL) {
    window.__setLocalAudio = function (m) { LOCAL_AUD = m || {}; rebuildIdx(); softRender(); };
    window.__ttsMissing = missingEn;
    if (window.__localTTS) window.__localTTS.onChange(function () { if (S.tab === 'settings' && !S.sess) softRender(); });
    if (window.__LOCAL_AUDIO) window.__setLocalAudio(window.__LOCAL_AUDIO);
  }
  render();
  var C = window.claude;
  if (!C || typeof C.use !== 'function') { S.dbState = 'none'; render(); return; }
  C.use('db').then(function (db) {
    if (!db) { S.dbState = 'none'; render(); return; }
    S.db = db;
    return C.use('user').then(function (user) {
      if (!user) return null;
      return user.id().then(function (id) { S.uid = id || null; });
    }).catch(function () {}).then(function () {
      if (!S.uid) { S.noSave = true; return; }
      return db.collection('data/users/' + S.uid).get().then(function (snap) {
        snap.docs.forEach(function (d) {
          var id = d.id, x = clone(d.data() || {});
          if (id === 'settings') Object.assign(U.settings, x);
          else if (id === 'progress') U.progress = Object.assign({ intro: {}, reh: {}, first: null }, x);
          else if (id === 'log') U.log = Object.assign({ days: {} }, x);
          else if (id === 'tests') U.tests = Object.assign({ list: [] }, x);
          else if (id.indexOf('srs_') === 0) U.srs[id.slice(4)] = Object.assign({ c: {} }, x);
        });
      }).catch(function (e) { console.warn('load failed', e && e.code); });
    }).then(function () {
      pickVoices();
      S.dbState = 'ready';
      db.collection('answers').orderBy('order').onSnapshot(function (snap) {
        S.answers = snap.docs.map(function (d) { var x = clone(d.data() || {}); x.id = d.id; x.lines = Array.isArray(x.lines) ? x.lines : []; return x; });
        softRender();
      }, function () { toast('Bağlantı kesildi; sayfayı yenile.'); });
      if (!LOCAL) try {
        db.doc('media/audio').onSnapshot(function (snap) {
          audExists = !!snap.exists;
          AUD = snap.exists ? clone(snap.data() || {}) : { files: {} };
          if (!AUD.files) AUD.files = {};
          if (S.uplLocal) Object.assign(AUD.files, S.uplLocal);
          rebuildIdx();
          if (S.tab === 'settings' && !(S.upl && S.upl.run)) softRender();
        }, function () {});
      } catch (e) { console.warn('audio map unavailable'); }
      C.use('assets').then(function (as) { S.assets = as || null; if (S.tab === 'settings') softRender(); }).catch(function () {});
      render();
      C.use('sample').then(function (smp) { S.sample = smp || null; if (S.tab === 'lines') softRender(); }).catch(function () {});
    });
  }).catch(function () { S.dbState = 'none'; render(); });
}
init();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  var hadCtrl = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadCtrl && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
