<!doctype html>
<html lang="tr">
<head>
<meta name="mt-app" content="travel">

<title>Seyahat Trainer</title>
<link rel="manifest" href="travel.webmanifest">

<link rel="icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#11141d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one phone-width column of index cards; fixed tab bar at the bottom.
   Same index-card world as the plan page: blue rules, one red margin line. */
:root {
  --paper: #f5f6fa;
  --card: #ffffff;
  --ink: #1b2340;
  --muted: #5d6685;
  --rule: #d9def0;
  --accent: #2f5bd3;
  --accent-soft: #e6ecfc;
  --on-accent: #ffffff;
  --margin: #d2453a;
  --ok: #1f8a5b;
  --ok-soft: #e2f4ea;
  --warn: #b5620c;
  --warn-soft: #fbefdf;
  --bad: #c23b31;
  --bad-soft: #fbe7e5;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --nav-h: 58px;
  --swoff: #c3c9dc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141d; --card: #191d29; --ink: #e5e8f2; --muted: #9aa2bd; --rule: #2b3147; --swoff: #3d4562;
    --accent: #84a2ff; --accent-soft: #222c4a; --on-accent: #0f1320; --margin: #e36a5f;
    --ok: #5cc994; --ok-soft: #173326; --warn: #e9a352; --warn-soft: #3a2a14; --bad: #ef7b70; --bad-soft: #3a1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141d; --card: #191d29; --ink: #e5e8f2; --muted: #9aa2bd; --rule: #2b3147; --swoff: #3d4562;
  --accent: #84a2ff; --accent-soft: #222c4a; --on-accent: #0f1320; --margin: #e36a5f;
  --ok: #5cc994; --ok-soft: #173326; --warn: #e9a352; --warn-soft: #3a2a14; --bad: #ef7b70; --bad-soft: #3a1d1b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--paper); overscroll-behavior-y: none; }
body {
  overscroll-behavior-y: none;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-inline-start: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 700; line-height: 1.15; }
h2 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); font-size: 14px; max-width: 60ch; }

.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 18px; }
.daybadge { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

/* Tabs */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--card); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-inline-start: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
nav.tabs::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 120px; background: var(--card); }
nav.tabs button { appearance: none; background: none; border: 0; color: var(--muted); font: 500 11.5px/1.2 var(--body); height: var(--nav-h); cursor: pointer; position: relative; display: grid; place-content: center; justify-items: center; gap: 3px; padding: 0; }
nav.tabs .ico { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; inset-inline-start: 22%; inset-inline-end: 22%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }

/* Icons: drawings and words come from ICONS / LABEL (lab, ico, tx) */
.ico { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
.il { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; vertical-align: bottom; }
.il .ico { width: 16px; height: 16px; }
.ctx .il { gap: 4px; } .ctx .il .ico { width: 14px; height: 14px; }

/* Buttons */
.btn {
  appearance: none; border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  font: 600 15px var(--body); padding: 11px 16px; border-radius: 8px; cursor: pointer; min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .link:focus-visible, .chipbtn:focus-visible, .arow:focus-visible, .anshead:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 0; }
.link { appearance: none; border: 0; background: none; color: var(--accent); font: 500 14px var(--body); cursor: pointer; padding: 8px 0; display: inline-flex; align-items: center; gap: 5px; }
.link .ico { width: 18px; height: 18px; }
.chipbtn { appearance: none; border: 1px solid var(--rule); background: transparent; color: var(--muted); font: 500 12px var(--body); padding: 3px 9px; border-radius: 999px; cursor: pointer; }
.chipbtn .ico { width: 15px; height: 15px; margin-inline-end: 5px; vertical-align: -.25em; }
.chipbtn.big { width: 40px; height: 40px; margin: -4px; padding: 0; display: inline-grid; place-items: center; color: var(--accent); border: 4px solid transparent; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--rule); } /* 32 px to see, 40 px to tap */
.chipbtn.big .ico { width: 18px; height: 18px; margin: 0; }
.chipbtn.big + .chipbtn.big { margin-inline-start: 2px; }
.btn.neg .ico { color: var(--bad); }
.btn.s { padding: 11px 4px; font-size: 14px; gap: 5px; white-space: nowrap; }
.btn.tb { display: grid; place-content: center; justify-items: center; gap: 2px; min-height: 48px; padding: 3px 2px; font: 600 12px/1.2 var(--body); }
.btn.tb .ico { width: 22px; height: 22px; }

/* Panels (Today) */
.stack { display: grid; gap: 12px; }
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ph .mono { font-size: 13px; color: var(--muted); }
.panel .q { font-weight: 500; }
.panel .hint, .hint { color: var(--muted); font-size: 13.5px; }
.hero { display: grid; gap: 6px; margin-bottom: 16px; }
.foot { margin-top: 18px; color: var(--muted); font-size: 13px; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; }

/* Index card */
.icard {
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
  padding: 18px 18px 16px 34px; position: relative; min-height: 230px;
  display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px;
}
.icard::before { content: ""; position: absolute; inset-inline-start: 20px; top: 0; bottom: 0; width: 1px; background: var(--margin); opacity: .5; }
.ctx { font-size: 12px; color: var(--muted); letter-spacing: .02em; display: flex; gap: 6px; flex-wrap: wrap; }
.ctx b { color: var(--ink); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.en { font-size: clamp(20px, 5.4vw, 24px); font-weight: 500; line-height: 1.38; overflow-wrap: anywhere; }
.en.small { font-size: 16px; color: var(--muted); font-weight: 400; }
.kp { color: var(--accent); font-weight: 650; }
mark.pkmiss { background: var(--warn-soft, transparent); color: var(--warn); border-radius: 3px; padding: 0 2px; }
.tr.anchor { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.tr { font-size: 17px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
.tr.big { font-size: clamp(19px, 5vw, 22px); color: var(--ink); }
.masked { filter: blur(7px); user-select: none; }
.cardfoot { margin-top: auto; min-height: 22px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tier { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tier.ezber { background: var(--bad-soft); color: var(--bad); }
.timer { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cardfoot > .timer { margin-inline-start: auto; } /* stays bottom right even if a narrow phone wraps it under the tag */
.timer.slow { color: var(--warn); }
.timer.big { font-size: 44px; color: var(--ink); line-height: 1; }
.sesshead { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.sesshead .mono { font-size: 13px; color: var(--muted); }
.skipnote { font-size: 13.5px; line-height: 1.45; color: var(--ink); background: var(--accent-soft); border-radius: 8px; padding: 8px 11px; margin: 0 0 10px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.steps span { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); }
.steps span.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.steps span.did { color: var(--ok); border-color: transparent; background: var(--ok-soft); }
/* Niyet: the answer's stops (Yeni) and the skeleton list (Prova) */
.durak { margin: -2px 0 10px; }
.durak .dseg { display: flex; gap: 3px; margin-bottom: 5px; }
.durak .dseg i { flex: 1; height: 4px; border-radius: 2px; background: var(--rule); }
.durak .dseg i.did { background: var(--ok); opacity: .55; }
.durak .dseg i.on { background: var(--accent); }
.durak p { font-size: 13px; color: var(--ink); line-height: 1.35; }
.durak .mono { color: var(--muted); font-size: 12px; margin-inline-end: 2px; }
.durak .dp { color: var(--muted); }
.stops { margin: 0 0 0 20px; display: grid; gap: 4px; font-size: 15px; line-height: 1.35; }
.kpat { font-size: 19px; line-height: 1.35; }
.kporig { margin-top: -6px; }
.arow.static { cursor: default; }
.anslines .ilab { display: block; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.say { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--accent); }
.say::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.count { font-family: var(--mono); font-size: 40px; line-height: 1; color: var(--accent); }

.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grade { flex-direction: column; gap: 2px; padding: 8px 4px; min-height: 58px; font-size: 14px; }
.grade small { font: 400 11px var(--mono); color: var(--muted); }
.g0 { color: var(--bad); border-color: var(--bad); }
.g2 { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.g2 small { color: var(--on-accent); opacity: .8; }
.g3 { color: var(--ok); border-color: var(--ok); }
.kbd { color: var(--muted); font-size: 12px; margin-top: 12px; text-align: center; }
@media (hover: none) { .kbd { display: none; } }

/* Segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border: 1px solid var(--rule); border-radius: 9px; padding: 3px; gap: 3px; margin: 12px 0 14px; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 14px var(--body); padding: 9px 6px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Answer list (Prova) */
.alist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.arow { appearance: none; width: 100%; text-align: start; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--ink); font: inherit; display: grid; gap: 4px; }
.arow .q { font-weight: 500; }
.arow .meta { font-size: 12.5px; color: var(--muted); }
.minibar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--ok); }
.result { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.result div { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
.result b { display: block; font: 600 22px var(--mono); }
.result span { font-size: 12px; color: var(--muted); }
.reslist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 6px; }
.reslist li { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.reslist li .mono { color: var(--muted); font-size: 12px; white-space: nowrap; }
.anslines { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.anslines li { font-size: 16px; line-height: 1.45; padding-inline-start: 12px; border-inline-start: 3px solid var(--rule); }
.anslines li.ezber { border-inline-start-color: var(--bad); font-weight: 500; }
.bigq { font-family: var(--display); font-size: clamp(22px, 6vw, 28px); font-weight: 600; line-height: 1.2; }

/* Lines (Cümleler) */
.ans { border-bottom: 1px solid var(--rule); }
.anshead { appearance: none; width: 100%; background: none; border: 0; color: var(--ink); font: inherit; text-align: start; padding: 14px 0; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; cursor: pointer; }
.anshead .num { color: var(--muted); font-size: 12px; }
.anshead .q { font-weight: 600; }
.anshead .cnt { color: var(--muted); font-size: 12px; }
/* progress per answer: green = settled (interval 7+ days, as in Prova), blue = learned and in review, grey = not started */
.lbar { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--rule); display: flex; overflow: hidden; }
.lbar i { display: block; height: 100%; }
.lbar .ok { background: var(--ok); }
.lbar .lr { background: var(--accent); }
.anshead .lmeta { grid-column: 2 / 4; color: var(--muted); font-size: 12px; margin-top: -4px; }
.verline { margin: 18px 0 4px; text-align: center; font-size: 12px; }
.lsum { margin: 0 0 14px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.lsum b { color: var(--ink); font-weight: 600; }
.lsum .lbar { grid-column: auto; }
.lleg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
.lleg span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; background: var(--rule); }
.lleg .ok::before { background: var(--ok); } .lleg .lr::before { background: var(--accent); }
.qtr { color: var(--muted); font-size: 13.5px; margin: -6px 0 10px 44px; }
ol.lines { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
li.line { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 12px 10px 14px; display: grid; gap: 6px; }
li.line.ezber { border-inline-start: 3px solid var(--bad); }
li.line .en { font-size: 16px; font-weight: 500; }
li.line .tr { font-size: 14.5px; }
.lact { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.lact .sp { flex: 1; }
.flag { font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 6px 9px; }
.orig { font-size: 13px; color: var(--muted); background: var(--paper); border-radius: 6px; padding: 7px 9px; }
.orig span { font-weight: 600; color: var(--ink); }
.defbox { display: grid; gap: 4px; } .defbox p { margin: 0; } .defbox .chipbtn { justify-self: start; margin-top: 4px; }
.form { display: grid; gap: 8px; }
.form label { font-size: 12px; color: var(--muted); font-weight: 500; }
.form textarea, .form select { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 10px; resize: vertical; }
.form textarea:focus, .form select:focus, .set select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.confirm { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px; display: grid; gap: 8px; font-size: 14px; }
.confirm.leave { margin-bottom: 12px; }
.addbox { background: transparent; border: 1px dashed var(--rule); border-radius: 8px; padding: 12px; margin-bottom: 16px; }

/* Settings */
.set { display: grid; gap: 8px; }
.set select { width: 100%; font: 15px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
.set input[type=range] { width: 100%; accent-color: var(--accent); }
.rangehead { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14.5px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.swlist { border: 1px solid var(--rule); border-radius: 12px; background: var(--card); overflow: hidden; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 52px; padding: 9px 14px; cursor: pointer; font-size: 15px; -webkit-tap-highlight-color: transparent; }
.sw + .sw { border-top: 1px solid var(--rule); }
.swt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.swt small { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.swbox { position: relative; flex: none; width: 46px; height: 28px; }
.swbox input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.swk { position: absolute; inset: 0; border-radius: 14px; background: var(--swoff); transition: background-color .18s ease; }
.swk::before { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .18s ease; }
.swbox input:checked + .swk { background: var(--accent); }
.swbox input:checked + .swk::before { transform: translateX(18px); }
.swbox input:focus-visible + .swk { outline: 2px solid var(--accent); outline-offset: 2px; }
.swbox input:disabled + .swk { opacity: .45; }
@media (prefers-reduced-motion: reduce) { .swk, .swk::before { transition: none; } }
/* Dinle: compact controls — scope on one row, value pickers and on/off chips flowing on one or two rows */
.ctl { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin: 0 0 14px; }
.kap, .segrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 8px; }
.kap > span, .segrow > span { font-size: 13px; color: var(--muted); }
.seg.sm { margin: 0; }
.seg.sm button { padding: 8px 2px; font-size: 13.5px; white-space: nowrap; }
.kap select { flex: 1; min-width: 0; width: 100%; text-overflow: ellipsis; font: 15px var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; }
.kap select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    "help.aCumle": "Cümleler",
    "helpPanel.tekrarDakiTrEn": "<b>{say}</b>: Tekrar'daki {src.code} → {tgt.code} kartında ve Prova'da klavyeyi {tgt.nativeDat} alıp klavyenin 🎤 tuşuyla söyle; uygulama söylediğini orijinalle kelime kelime karşılaştırır, yüzde ve eksik kelimeleri gösterir, Tekrar'da puan önerir. Büyük-küçük harf, noktalama, I'm = I am ve 1,500 = fifteen hundred fark sayılmaz.",
    "helpPanel.prova3Tur4": "<b>Prova</b>: <b>3 tur (4/3/2)</b> ile aynı cevabı kısalan sürede tekrar anlat (2. tur 1. turun %85'i, 3. tur %70'i). <b>Takip soruları</b> açıkken puanladıktan sonra o cevabın takip sorusu gelir (en fazla 2). <b>Mülakat</b>: art arda 5 soru, çoğu önceki cevabın takip sorusu.",
    "helpPanel.ekranAcikKalirCalisirken": "<b>Ekran açık kalır</b>: çalışırken (Yeni, Tekrar, Prova, Hız testi) ve Dinle çalarken ekran kararmaz. 5 dk dokunmazsan normal kararır (Dinle çalarken hariç). iOS 18.4 ve sonrası.",
    "helpPanel.hatirlaTurkceyeBakipIngilizcesini": "<b>Hatırla</b>: {src.dat} bakıp {tgt.possAcc} kendin söyle; süre bitince (ya da <b>Göster</b> ile) doğrusu açılır ve çalar. Oturmadıysa <b>{pk}</b>. {:mic} ile kontrol edebilirsin; yüzde gösterilir, puan verilmez.",
    "helpPanel.her45Satirda": "Her 4–5 satırda kısa <b>Kontrol</b>: o satırlar karışık sırayla gelir; {src.acc} gör, {tgt.possAcc} söyle. {:mic} ile söylersen sonuç görünür ve {said} ya da {askAgain} önerilir; karar senin.",
    "helpPanel.nedenBuSiraDinle": "<b>Neden bu sıra?</b> Dinle ve Anlam cümleyi tanıtır. Gölgeleme ses ve ritmi oturtur; 3. turda sesle birlikte söylemek akıcılık katar. İmge cümleyi kendi hayatından bir sahneye bağlar ve kısa bir ara verir; bu yüzden Hatırla'da cümle kulağındaki yankıdan değil hafızadan gelir (imgeyi ipucu olarak kullan). Kontrol aynı satırları biraz sonra, karışık sırayla yeniden çağırır: aralık ve karışıklık kalıcılığı artırır. Sonraki günlerde Tekrar, aralıkları büyüterek aynı işi sürdürür.",
    "helpPanel.yaridaBirakirsanBaskaSekme": "Yarıda bırakırsan (başka sekme, <b>{pause}</b> ya da uygulamayı kapatma) yer kaybolmaz: Bugün → Yeni'de <b>Kaldığın yerden devam</b> aynı satır ya da kontrolden sürdürür (o gün içinde).",
    "helpPanel.kirmiziKenarliSatirEzber": "<b>Kırmızı kenarlı satır = ezber</b> (kelimesi kelimesine; açılış, kapanış, ana cümle). Diğerleri <b>anlam</b>: ana fikir ve terimler yeter. Türü <b>Cümleler → Düzenle</b>'de değiştirebilirsin; <b>Boş</b> seçersen kartta etiket görünmez, kontrol Anlam gibi yapılır.",
    "helpPanel.maviKelimelerKalipBaska": "<b>Mavi kelimeler = kalıp</b>: başka cümlelerde de kullanacağın genel {tgt.name} çerçeve. Öğrenme, tekrar, hız testi ve Dinle ekranlarında görünür; Ayarlar → Akış → <b>Kalıp vurgusu</b> ile kapatılır.",
    "helpPanel.duzenlerkenYaDaSatir": "Düzenlerken ya da satır eklerken kalıbı <b>[köşeli parantez]</b> içine alabilirsin (en fazla 2, en az 2 kelime). Parantez yoksa uygulama bilinen kalıplardan kendisi bulur.",
    "helpPanel.yeniDeKartinUstunde": "<b>Yeni</b>'de kartın üstünde: çizgi cevabın tüm satırları (yeşil = geçtiğin, mavi = şimdiki), altında <b>Durak 4/13</b> · önceki › <b>şimdiki</b> › sonraki.",
    "helpPanel.provaDaTamCevaptan": "<b>Prova</b>'da tam cevaptan önce 20 sn'lik <b>iskelet turu</b>: durakları sırayla söylersin, sonra listeyle karşılaştırırsın. Cevabın sonunda her satırın üstünde durak adı yazar.",
    "helpPanel.nedenUzunCevaptaTakilmanin": "<b>Neden?</b> Uzun cevapta takılmanın asıl sebebi çoğu zaman cümle değil sıradır: “şimdi ne gelecekti?”. Önce iskeleti oturtmak, cümleleri doğru sırayla çağırmayı kolaylaştırır.",
    "helpPanel.tekrarKontrolMulakatVe": "Tekrar, Kontrol, Mülakat ve Dinle'de görünmez; oralarda cümlenin kendisi çalışılır. Durak adını <b>Cümleler</b>'de satırı düzenleyerek değiştirebilirsin; cümle güncellemesi senin yazdığını ezmez. Kapatmak: Ayarlar → Akış → <b>Niyet ve iskelet</b>.",
    "helpPanel.siraOnceAraligiKisa": "<b>Sıra</b>: önce aralığı kısa olan kartlar (dün, önceki gün öğrendiklerin ya da Tekrar dediklerin), sonra eskiler. Taze kart bir gün gecikince çok unutulur, oturmuş kart az. Hepsini bitiremeyeceğin gün tazeleri yapıp Bitir de; kalanlar yarın gelir. Aynı aralıktaki kartlar karışık gelir, cevaplar sırayla.",
    "helpPanel.gosterDenOnceYa": "<b>{skipDay}</b> (Göster'den önce, ya da G): kart bugünkü listeden çıkar, puanı ve takvimi değişmez, yarın yine gelir. Aynı kartı 3 gün üst üste geçersen kartın üstünde not çıkar; puan verince sayım sıfırlanır.",
    "helpPanel.dinleBDekiOk": "Dinle B'deki {:ok} ve {:no}, ayrıca Hız testindeki yanlışlar da aynı takvime işlenir.",
    "helpPanel.hatirlaDaHerZaman": "<b>{pk}</b> (Hatırla'da her zaman; Kontrol ve Tekrar'da {:mic} sonucu Zor ya da Tekrar ise): ~20 sn. 1/3 metinle dinle ve aynen tekrar et (eksik kalıp kelimeleri turuncu), 2/3 metinsiz sesle birlikte söyle, 3/3 bir kez kendin söyle ({:mic} sadece yüzde). Puan ilk denemene göre kalır. Siri modunda da hazır sesi çalar.",
    "helpPanel.sonucBirOneridirPuani": "Sonuç bir <b>öneridir</b>; puanı sen seçersin. Aşağıdaki cümleler yalnız örnektir.",
    "helpPanel.onceAyniBicimYazim": "<b>Önce aynı biçim</b>: yazım farkı hata sayılmaz. Hedef “closes at 5”, dikte “closes at five” yazarsa aynıdır.",
    "helpPanel.ezberSatiriKelimeKelime": "<b>Ezber</b> satırı kelime kelime karşılaştırılır: %94 ve üstü İyi, %70 ve üstü Zor. Mavi kalıptan bir kelime eksikse en fazla Zor. <b>Anlam</b> satırında sıra ve ekler (pan / pans) sorun değil; ana fikir ve terimler yeter.",
    "helpPanel.farkliAyniKelimeninBaska": "<b>Farklı</b>: aynı kelimenin başka halini söylersen tek satırda görünür. Hedef “wash the <b>pan</b>”, sen “wash the <b>pans</b>” → <b>Farklı: pan → pans</b>. Yalnız gösterim böyledir; puan yine yukarıdaki kurala göre çıkar. Başka kelimeler <b>Eksik</b> ve <b>Fazla</b> olarak kalır.",
    "helpPanel.duyulduguGibiYazilanIsim": "<b>Duyulduğu gibi yazılan isim</b>: dikte bilmediği bir adı sese göre yazabilir. Hedef “The parts came from <b>Paris</b>”, dikte “the parts came from <b>pairs</b>” → Paris sayılır.",
    "helpPanel.dogruSoylenenKelimeIsme": "<b>Doğru söylenen kelime isme çevrilmez</b> (1): satırın kendi kelimesinin başka hali olduğu gibi kalır. Hedef “The <b>parts</b> came from Paris”, sen “the <b>part</b> came from Paris” → part, Paris yapılmaz; Ezber'de Farklı: parts → part.",
    "helpPanel.dogruSoylenenKelimeIsme2": "<b>Doğru söylenen kelime isme çevrilmez</b> (2): ad, satırda kaç kez geçiyorsa en fazla o kadar tamamlanır, sesi en yakın olan önce. Hedef “The boxes came from Paris”, sen “the parts came from Paris” → Paris zaten söylendi, parts olduğu gibi kalır.",
    "helpPanel.satirdaGecenIfadeBaska": "<b>Satırda geçen ifade başka terime çevrilmez</b> (3): “American” normalde US sayılır; ama hedef “An American friend lives in the US” ise ikisi de olduğu gibi kalır.",
    "helpPanel.siniriAdiHicSoylemezsen": "<b>Sınırı</b>: adı hiç söylemezsen ve benzer sesli, satırda olmayan bir kelime dersen yine ada çevrilebilir. Hedef “The boxes came from Paris”, sen “the parts came late” → parts, Paris sanılır.",
    "helpPanel.zorlandiklarim": "Zorlandıklarım",
    "helpPanel.neZamanEklenirTekrar": "<b>Ne zaman eklenir?</b> Tekrar'da <b>Tekrar</b> dediğin satır hemen eklenir. <b>Zor</b>, Dinle'de {:no} ya da Kontrol'de <b>Tekrar sor</b> tek başına yetmez: aynı satırda yaklaşık bir hafta içinde ikinci kez olursa eklenir.",
    "helpPanel.neZamanCikarSatiri": "<b>Ne zaman çıkar?</b> Satırı <b>iki ayrı günde</b> doğru söyleyince: Tekrar'da İyi/Kolay, Dinle'de {:ok} ya da Hız testinde zamanında doğru. Tek bir {:ok} yetmez; aynı gün iki kez doğru söylemek de bir sayılır. Arada yine zorlanırsan sayım baştan başlar.",
    "helpPanel.ornekPazartesiTekrarDedin": "<b>Örnek</b>: Pazartesi Tekrar dedin → listeye girdi. Salı İyi dedin → 1/2. Perşembe Dinle'de {:ok} → listeden çıktı.",
    "helpPanel.nedenZorBirSatir": "<b>Neden?</b> Zor bir satır, ayrı günlerde art arda doğru hatırlanınca kalıcı olur; bir kez doğru söylemek yetmez. Liste kısa tutulur ki her gün bitirebilesin.",
    "helpPanel.ayrintiHerZorlanmaPuan": "Ayrıntı: her zorlanma puan ekler (Tekrar 3, Zor 2, {:no} 2, Tekrar sor 2, Pekiştir 1, Hatırla'da Pekiştir 0,5). 3 puanda listeye girer; puanlar bir haftada yarıya iner, iki haftadan eskisi sayılmaz.",
    "helpPanel.onceTurkceAOtomatik": "<b>Önce {src.name}</b> (A): <b>Otomatik</b> = öğrenilmemiş ya da unutulmuş satırda cümle başında {src.name} 1× (anlam çapası), öğrendiğin satırda sadece {tgt.name}. <b>Her zaman</b> / <b>Kapalı</b> da seçilebilir. {src.name} turlar arasında çalmaz.",
    "helpPanel.sonTurEszamanliA": "<b>Son tur eşzamanlı</b> (A): son turda boşluk yok; sesle aynı anda söyle. Ritim ve vurgu için.",
    "helpPanel.bSesliRecallTurkce": "<b>B · Sesli hatırlama</b>: {src.name} → düşünme süresi içinde {tgt.possAcc} sen söyle → {tgt.name} N kez. Süre cümle uzunluğuna ve konuşma hızına göre, en az 3 sn (Süreler); Kısa / Normal / Uzun ile ayarlanır, kartta geri sayım görünür. {tgt.acc} duyunca kartın köşesinden işaretle: <b>{:ok} bildim</b> (sonraki karta geçer, tekrar ileri atılır), <b>{:no} bilemedim</b> (kart bu oturumda yeniden gelir). Hiç basmazsan bir şey değişmez.",
    "helpPanel.yanlisIsaretDoluKutuya": "Yanlış işaret: dolu kutuya yeniden bas, 5 sn görünen <b>Geri al</b>'a bas ya da Önceki ile dönüp kaldır.",
    "helpPanel.kapsamBugunCalisilacaklarVadesi": "<b>Kapsam</b>: Bugün çalışılacaklar (vadesi gelenler; A ve B), öğrendiklerin, tümü, bir grup ya da tek cevap.",
    "helpPanel.calarkenOncekiDuraklatDevam": "Çalarken: <b>Önceki · Duraklat/Devam · Sonraki</b>; oturumu bitirmek için <b>Bitir</b>.",
    "helpPanel.kilitteCalVarsayilanAcik": "<b>Kilitte çal</b> (varsayılan açık): ekran kilitliyken de çalar; kilit ekranından ve kulaklıktan Önceki, Duraklat/Devam, Sonraki çalışır. Duraklattıktan sonra en az 5 dk kilit ekranından devam edebilirsin. Kapsamda hazır sesi olmayan cümle varsa (örneğin senin değiştirdiğin) ekran açık kalmalı.",
    "helpPanel.kayitProvaYalnizcaYa": "<b>Kayıt</b>: prova yalnızca <b>{stuck}</b> ya da <b>{fluent}</b> ile kaydedilir (tarih, süreler, söylenen yüzde). Uygulama birini çerçeveyle önerir: hedef süreyi aştıysan ya da {:mic} ile cevabın yarısından azı söylendiyse Takıldım, %85 ve üstü süresinde söylendiyse Akıcıydı; karar senin. Kaydetmeden <b>{end}</b> düğmesine basarsan önce sorar.",
    "helpPanel.iskeletTuruCevapProvasi": "<b>İskelet turu</b> (Cevap provası, 1. tur): <b>Başla · önce iskelet</b> ile 20 sn içinde cevabın duraklarını sırayla, birkaç kelimeyle söyle; sonra durak listesi açılır, <b>Tam cevaba başla</b> ile asıl turu başlat. Süre tam cevapta başlar. İstemezsen <b>İskeletsiz başla</b>. Mülakat modunda yok.",
    "helpPanel.kalipOgrendiginSatirlarinKaliplariyla": "<b>Kalıp</b>: öğrendiğin satırların kalıplarıyla <b>yeni</b> cümle kur. Kartta kalıp, geldiği orijinal cümle ve {src.name} bir durum var; durumu o kalıpla {tgt.name} söyle. <b>Göster</b> bir örnek cümle açar ve çalar. {:mic} ile söylersen uygulama kalıbın sabit parçalarının (mavi) sırayla geçip geçmediğine bakar ve {built} ya da {notBuilt} önerir; karar senin. Kuramadıkların bir sonraki oturumda önce gelir, her kalıbın durumları sırayla değişir. Tekrar takvimine ve Zorlandıklarım'a dokunmaz.",
    "helpPanel.hizTestiTurkceyiGor": "<b>Hız testi</b>: {src.acc} gör, {tgt.possAcc} söyle, biter bitmez Göster. Hedef: doğru ve süresinde: kısa cümlede ~3–4 sn, uzun cümlede daha fazla. Yanlışlar bugünkü tekrara eklenir.",
    "helpPanel.usttekiGrupButonlariListeyi": "Üstteki grup butonları listeyi ve testi o gruba daraltır.",
    "helpPanel.butunSenSoyleSureleri": "Bütün \"sen söyle\" süreleri tek bir hesaptan gelir, cümlenin uzunluğuna ve {tgt.name} konuşma hızına göre. Akış değişmez; sadece bekleme ve uyarı süreleri cümleye uyar.",
    "helpPanel.tabanKelimeBasina0": "<b>Taban</b>: kelime başına 0,42 sn ÷ konuşma hızı. 12 kelime: 1,0× hızda 5 sn, 0,7× hızda 7,2 sn.",
    "helpPanel.tekrarEtGolgeleDinle": "<b>Tekrar et</b> (Gölgele, Dinle A): duyduğun sesin süresi × 1,15 + 0,6 sn.",
    "helpPanel.hafizadanSoyleHatirlaDinle": "<b>Hafızadan söyle</b> (Hatırla, Dinle B, kart sayacı, Hız testi): (1,5 sn + taban) × Düşünme süresi (Kısa 0,75 · Normal 1 · Uzun 1,35), en az 3 sn. Örnek, Normal: 6 kelime ~4 sn, 12 kelime ~6,5 sn, 24 kelime ~11,6 sn (0,7× hızda ~15,9 sn).",
    "helpPanel.kartSayaciTekrarKontrol": "<b>Kart sayacı</b> Tekrar, Kontrol ve Hız testinde bu süreye kadar gri, sonra turuncu. Sadece gösterge; puanı sen verirsin.",
    "helpPanel.hizTestiKartiBu": "<b>Hız testi</b>: kartı bu süre içinde ve doğru söylersen \"doğru ve süresinde\" sayılır.",
    "helpPanel.provaHedefiHicbirZaman": "<b>Prova</b> hedefi hiçbir zaman dakikada ~170 kelimeden hızlı değildir.",
    "helpPanel.soldaKodSagdaDurum": "Solda kod, sağda durum: <b>✓</b> öğrenildi · <b>+N</b> öğrenilmemiş satır · <b>#N</b> yeni cevap sırası, sonra satır sayısı.",
    "helpPanel.cevabiAcincaTurkceSoru": "Cevabı açınca: {src.name} soru, ana cümle, iskelet / anahtar kelimeler, net söylenecek kelimeler ve notlar.",
    "helpPanel.degistiYalnizcaSeninDegistirdigin": "<b>Değişti</b> yalnızca senin değiştirdiğin satırlarda çıkar: dokununca uygulamanın varsayılan cümlesi ({tgt.name} ve {src.name}) görünür. <b>Varsayılana dön</b> senin değişikliğini siler, satır yine güncellemeleri alır. Bir güncelleme varsayılanı değiştirirse kutuda <b>Varsayılan güncellendi</b> yazar; senin metnin olduğu gibi kalır.",
    "helpPanel.notlarAAktarMetni": "<b>Notlar'a aktar</b>: metni Notlar'a yapıştır, iPhone'un <b>Ekranı Seslendir</b> özelliğiyle (Ayarlar → Erişilebilirlik → Seslendirilen İçerik) Siri sesinde internetsiz dinle.",
    "helpPanel.kisayollar": "Kısayollar",
    "helpPanel.ilerlemeBuCihazdaSaklanir": "İlerleme bu cihazda saklanır, internetsiz çalışır. Telefonda Safari → Paylaş → <b>Ana Ekrana Ekle</b>, Mac'te Safari → Dosya → <b>Dock'a Ekle</b>, Chrome'da <b>Yükle</b> ile uygulama gibi açılır. Tarayıcı sekmesinde açınca alttan bir <b>yükleme penceresi</b> açılır: Chrome ve Edge'de <b>Yükle</b> düğmesi, iPhone Safari'de Paylaş → Ana Ekrana Ekle adımları. <b>Kapat</b> 7 gün gizler; yüklü uygulamada hiç çıkmaz.",
    "helpPanel.herTarayiciVeUygulama": "Her tarayıcı ve uygulama kendi kaydını tutar: iPhone'da Safari sekmesi ile ana ekran uygulamasının ilerlemesi ve parolası ayrıdır. Hep aynı yerden (ana ekran uygulaması) aç.",
    "helpPanel.parolaHerCihazdaBir": "Parola her cihazda bir kez sorulur. Cümleler ve sesler şifreli saklanır.",
    "helpPanel.ilerlemeyiSifirlaTekrarTakvimi": "<b>İlerlemeyi sıfırla</b>: tekrar takvimi, öğrenilen satırlar, prova ve test geçmişi silinir; cevaplar, düzenlemeler, ayarlar ve sesler kalır. Önce otomatik yedek alınır, <b>Sıfırlamayı geri al</b> ile dönebilirsin.",

function rehNew(a, chain) { return { type: 'reh', a: a, phase: 'ready', t0: 0, ms: 0, round: 1, times: [], target: 0, chain: chain || null, dictOpen: false, dictText: '', cov: null }; }

/* 4/3/2: rounds 2 and 3 aim for 85% and 70% of round 1 (rounded to 5 s), never faster than ~170 words a minute */
function roundTarget(a, t1, r) {

}
/* the mock interview pool: answers started in the chosen group (or all of the group when nothing is started yet) */
function mockPool() { var all = grpAnswers(); var p = all.filter(started); return p.length >= 2 ? p : (all.length ? all : S.answers); }

function chainNext(s) {

  var fu = (s.a.fu || []).filter(fresh);
  if (c.kind === 'fu') return fu.length ? ansById(fu[0]) : null;
  var pool = c.pool.filter(fresh);
  if (pool.indexOf('hm08') >= 0 && c.steps.length === c.n - 1) return ansById('hm08');
  var inPool = fu.filter(function (id) { return pool.indexOf(id) >= 0; });
  if (inPool.length) return ansById(inPool[0]);
  var rest = pool.filter(function (id) { return id !== 'hm08'; });
  if (!rest.length) rest = pool;
  return rest.length ? ansById(rest[Math.floor(Math.random() * rest.length)]) : null;
}
function peekNext(s) {

function rehSave(ok) {
  var s = S.sess, a = s.a, prev = U.progress.reh[a.id] || { n: 0, hist: [] }, times = s.times.concat([s.ms]);
  var hist = (prev.hist || []).concat([{ d: today(), ms: times[0], ok: ok }]).slice(-12);
  var rec = { last: today(), n: (prev.n || 0) + 1, ms: times[0], ok: ok, hist: hist };
  if (times.length > 1) rec.r = times;
  if (s.cov) rec.cov = s.cov.score;
  U.progress.reh[a.id] = rec; save('progress');
  if (s.chain) {
    var nx = peekNext(s);
    s.chain.steps.push({ id: a.id, times: times, ok: ok, hint: !!s.hint, cov: s.cov ? s.cov.score : null });
    if (nx && s.chain.steps.length < s.chain.n) {
      s.chain.seen.push(nx.id); var keep = s.dictOpen; S.sess = rehNew(nx, s.chain); S.sess.dictOpen = keep; render(); top(); play(nx.q, TGT); return;
    }
    if (s.chain.steps.length > 1) { S.sess = { type: 'rehsum', chain: s.chain }; render(); top(); return; }
  }
  S.sess = null; S.tab = 'reh'; render(); top(); toast(tm('rehSave.provaKaydedildi'));
}

<script>
/* ---- install drawer: one "Ana ekrana ekle" sheet for every browser that can install the app ----
   Never shown in the installed app (display-mode standalone / navigator.standalone), nor while the passphrase screen is up.
   Chrome, Edge (Android and desktop): the browser's beforeinstallprompt is caught (its own banner is held back), the sheet
     offers "Yükle", which opens the browser's install dialog (deferredPrompt.prompt()).
   iPhone/iPad Safari: no such event exists, so the same sheet shows two steps (Share → Add to Home Screen).
   Mac Safari: the same sheet with its menu path (File → Add to Dock). Firefox: nothing (it cannot install web apps).
   "Kapat" (or the install dialog's own cancel) hides it for 7 days (localStorage mt-inst-until).
   To change the texts or the 7 days: INST below. */
(function () {
  var tm = window.__i18n.t;
  var INST = { days: 7, name: tm('INST.mulakatTrainer'), icon: 'icon-192.png',
    lead: tm('INST.dahaHizliErisimVe') };
  var standalone = false; try { standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) {}
  if (standalone) return;
  function until() { try { return +localStorage.getItem('mt-inst-until') || 0; } catch (e) { return 0; } }
  function snooze() { try { localStorage.setItem('mt-inst-until', String(Date.now() + INST.days * 86400000)); } catch (e) {} }
  var ua = navigator.userAgent || '', ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var safari = /Safari\//.test(ua) && !/Chrome|Chromium|CriOS|Edg|EdgiOS|OPR|Firefox|FxiOS/.test(ua);
  function icon(n) { return window.__ico ? window.__ico(n, 18) : ''; }
  var deferred = null, el = null;
  function steps() {
    if (ios && safari) return '<ol><li>' + tm('steps.tarayicininAltindakiPaylasButonuna', { icon: icon('share') }) + '</li><li>' + tm('steps.acilanMenudeAsagiKaydirip', { icon: icon('addbox') }) + '</li></ol>';
    if (safari) return ('<ol><li>' + tm('steps.safariMenuCubugundaDosya') + '</li><li>' + tm('steps.dockAEkleYi') + '</li></ol>');
    return '';
  }
  function close(keep) { if (!el) return; el.classList.remove('open'); if (!keep) snooze(); }

    if (until() > Date.now()) return;
    var gate = document.getElementById('gate'); if (gate && !gate.hidden) { setTimeout(open, 1500); return; } // after the passphrase screen
    if (!el) {
      el = document.createElement('div'); el.className = 'idrawer'; el.id = 'idrawer';
      el.setAttribute('role', 'dialog'); el.setAttribute('aria-labelledby', 'idrawer-t');

        }
      });

    el.innerHTML = '<div class="sheet"><div class="grip"></div><div class="head"><img src="' + INST.icon + '" alt=""><div><b id="idrawer-t">' + INST.name + '</b><span>' + INST.lead + '</span></div></div>' + st + '<div class="acts' + (deferred ? '' : ' one') + '"><button class="btn" type="button" data-i="close">' + tm('open.kapat') + '</button>' + (deferred ? ('<button class="btn primary" type="button" data-i="install">' + tm('open.yukle') + '</button>') : '') + '</div></div>';
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('open'); }); });
  }

}
